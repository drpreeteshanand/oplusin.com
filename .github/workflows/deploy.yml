name: Deploy to VPS (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload site files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 201.18.201.1
          username: oplusin_com
          password: ${{ secrets.OPLUSIN_COM }}
          server-dir: /
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            README.md
            CNAME
